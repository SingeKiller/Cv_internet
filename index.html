    <script>
      (function () {
        var root = document.documentElement;
        var theme = null;
        var lang = null;
        try {
          theme = localStorage.getItem("theme");
          lang = new URLSearchParams(location.search).get("lang") || localStorage.getItem("lang");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (lang !== "fr" && lang !== "en") {
          lang = null;
          var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "fr"];
          for (var i = 0; i < prefs.length && !lang; i++) {
            var code = String(prefs[i]).slice(0, 2).toLowerCase();
            if (code === "fr" || code === "en") lang = code;
          }
        }
        root.setAttribute("data-theme", theme);
        root.setAttribute("lang", lang || "en");
      })();
    </script>
